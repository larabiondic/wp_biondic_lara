<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        .relative {
            width: 500px;
            height: 300px;
            border: 1px solid black;
            position: relative;
        }
        .prvi {
            background-color: blue;
            width: 200px;
            height: 300px;
            position: absolute;
            top: 0;
            left: 260px;
        }
        .drugi {
            background-color: rebeccapurple;
            width: 200px;
            height: 300px;
            position: absolute;
            top: 0;
            left: 40px;
        }

    </style>
</head>
<body>
    <h1>CSS position</h1>
    <div class="relative">
        <div class="prvi"></div>
        <div class="drugi"></div>
    </div>
</body>
</html>
