<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zastava</title>
    <style>
        .crvena {
            width: 900px;
            height: 700px;
            background-color: red;
            position: relative;
            
            z-index: 1;
        }
        .plava {
            width: 900px;
            height: 300px;
            background-color: darkblue;
            position: absolute;
            top: 200px;
            z-index: 2;

        }
        .bijela {
            width: 250px;
            height: 250px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 225px;
            left: 350px;
            z-index: 3;
        }
        .pplava {
            width: 900px;
            height: 500px;
            background-color: rgb(71, 71, 241);
            position: relative;
            z-index: 1;

        }
        .žuuta {
            width: 100px;
            height: 500px;
            background-color: yellow;
            position: absolute;
            left: 250px;


        }
        .žuta {
            width: 900px;
            height: 100;
            background-color: yellow;
            position: absolute;
            top: 250px;

        }
        
    </style>
</head>
<body>
    
    <div class="plava"></div>
    <div class="bijela"></div>
    <div class="crvena"></div>
    <hr>
    <br>
    <br>
    <h1>Zastava Švedske</h1>
    <div class="pplava">
        <div class="žuuta"></div>
        <div class="žuta"></div>
    </div>
</body>
</html>
